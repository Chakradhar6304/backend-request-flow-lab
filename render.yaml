services:
  - type: web
    name: backend-request-flow-lab
    runtime: docker
    plan: free
    repo: https://github.com/Chakradhar6304/backend-request-flow-lab
    branch: main
    dockerfilePath: ./Dockerfile.services
    dockerContext: .
    dockerCommand: node scripts/start-public.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: KAFKA_BROKERS
        sync: false
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: KAFKA_CA_CERT
        sync: false
      - key: KAFKA_SSL
        value: "true"
      - key: USER_TOKEN_SECRET
        generateValue: true
      - key: SERVICE_TOKEN_SECRET
        generateValue: true
      - key: OTEL_DISABLED
        value: "true"
      - key: SERVE_WEB
        value: "true"
